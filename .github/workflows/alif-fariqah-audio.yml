name: Generate Alif Fariqah Grade 8 audio

on:
  workflow_dispatch:
    inputs:
      voice:
        description: "Arabic neural voice"
        required: true
        default: "ar-SA-HamedNeural"
        type: choice
        options:
          - ar-SA-HamedNeural
          - ar-SA-ZariyahNeural
  push:
    paths:
      - 'content/alif-fariqah-grade8.txt'
      - 'scripts/generate_alif_fariqah_audio.py'
      - '.github/workflows/alif-fariqah-audio.yml'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install speech synthesizer
        run: python -m pip install 'edge-tts>=7,<9'
      - name: Render 50 Arabic audio clips
        env:
          VOICE: ${{ github.event.inputs.voice || 'ar-SA-HamedNeural' }}
        run: python scripts/generate_alif_fariqah_audio.py --voice "$VOICE"
      - name: Validate every file
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('site/audio/alif-fariqah-grade8')
          expected={f'q{i:02d}.mp3' for i in range(1,51)}
          found={x.name for x in p.glob('*.mp3') if x.stat().st_size>1000}
          if found!=expected:
              raise SystemExit(f'Missing or invalid: {sorted(expected-found)}')
          print('Validated 50 nonempty audio files')
          PY
      - name: Downloadable ZIP with 50 MP3 files
        uses: actions/upload-artifact@v4
        with:
          name: alif-fariqah-grade8-50-mp3
          path: site/audio/alif-fariqah-grade8/*.mp3
          if-no-files-found: error
          retention-days: 30
